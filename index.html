<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Amusement Park · Jiaqi</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#24112f; --panel:#2e1638; --panel2:#3a1c48; --line:#6a2f6e; --ink:#fff0f7; --muted:#d79bc0;
  --gold:#ff8fc7; --blue:#3d6cff; --green:#5be08a; --red:#ff5d6c; --orange:#ff9a3d; --pix:'Press Start 2P',monospace; --mono:'VT323',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:20px;line-height:1.15}
a{color:#8fb4ff;text-decoration:none} a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer}
#app{display:flex;flex-direction:column;min-height:100vh}
#map{position:relative;width:100%;aspect-ratio:640/280;max-height:72vh;margin:0 auto;overflow:hidden;background:#24112f}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;cursor:default}
#ov{position:absolute;inset:0;pointer-events:none;font-size:2px}
#ov > *{position:absolute;transform:translate(-50%,-100%);white-space:nowrap}

/* zone labels */
.zl{font-family:var(--pix);font-size:4.4em;letter-spacing:.06em;background:#3a1240ee;border:.5em solid #000;outline:.25em solid #b0508f;padding:.55em .9em .45em;color:#fff;text-shadow:.15em .15em 0 #000;display:flex;gap:.6em;align-items:center}
.zl b{color:var(--muted);font-weight:400}
.zl.on{outline-color:var(--gold)} .zl.gate{background:#ff8fc7;color:#4a1240;text-shadow:none;outline-color:#fff;font-size:5em} .zl.on b{color:var(--gold)}
.zl .ic{font-family:system-ui;font-size:.95em}

/* agent tags */
.tag{pointer-events:auto;cursor:pointer;font-family:var(--pix);font-size:3.2em;background:#3a1240dd;border:.3em solid #000;padding:.35em .5em .25em;display:flex;gap:.45em;align-items:center;color:#d9d6ff}
.tag:hover,.tag.sel{border-color:var(--gold);color:#fff;z-index:5}
.tag .n{background:#b0508f;color:#fff;padding:0 .3em}
.tag .own{color:#0b0c1e;padding:0 .3em}
.tag .lv{color:var(--muted)}
.tag.dim{opacity:.75}
.bub{font-family:var(--mono);font-size:3.6em;background:#efe9d6;color:#2a2440;border:.25em solid #000;padding:.05em .4em;max-width:44em;overflow:hidden;text-overflow:ellipsis;box-shadow:.3em .3em 0 #0006}
.bub.wait{background:var(--gold);font-family:var(--pix);font-size:3em;padding:.35em .5em}
.tomb{font-family:var(--pix);font-size:2em;color:#9aa0c8;background:#3a124099;padding:.2em .3em;transform:translate(-50%,0)!important;pointer-events:auto;cursor:pointer;max-width:13em;overflow:hidden;text-overflow:ellipsis}
.tomb:hover{color:#fff}
.board{transform:none!important;font-family:var(--mono);color:#3a2f22;font-size:4.3em;line-height:1.05;white-space:normal!important;overflow:hidden;pointer-events:auto;cursor:pointer}
.board b{font-family:var(--pix);font-size:.6em}
.board i{display:block;color:#7d6b52;font-size:.85em;margin-top:.2em}

/* detail card */
#card{position:absolute;top:2%;right:1.2%;width:min(420px,38%);max-height:92%;overflow:auto;background:#2e1236f2;border:4px solid #000;outline:2px solid var(--gold);padding:14px 16px;display:none;z-index:20;font-size:19px}
#card.show{display:block}
#card .x{position:absolute;top:6px;right:8px;background:none;border:0;font-size:26px;color:var(--muted)}
#card h3{font-family:var(--pix);font-size:13px;margin:0 0 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#card .k{font-family:var(--pix);font-size:9px;color:var(--muted);margin:12px 0 4px}
#card ul{margin:0;padding:0;list-style:none} #card li{padding:2px 0;border-bottom:1px dashed #6a2f6e;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#card li time{color:var(--muted);margin-right:6px}
#card code{font-family:var(--mono);color:#b9b4ff;word-break:break-all}
.pill{font-family:var(--pix);font-size:9px;padding:3px 6px;border:2px solid #000;background:#6a2f6e}
.pill.working{background:#1f6b3d}.pill.waiting{background:#8a6d12}.pill.idle{background:#5a3a1a}.pill.dead{background:#3a3a4a}

#toast{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:30;pointer-events:none}
#toast div{font-family:var(--pix);font-size:11px;background:var(--gold);color:#1a1530;border:3px solid #000;padding:8px 12px;box-shadow:4px 4px 0 #0008;animation:pop .25s}
@keyframes pop{from{transform:translateY(10px);opacity:0}}
#banner{pointer-events:auto}
#banner.demo{font-size:13px;border-width:3px;background:#ff9a3d;color:#2a1030;padding:10px 14px;left:50%;transform:translateX(-50%);bottom:auto;top:3%}
#banner.demo code{color:#2a1030}
#banner{position:absolute;bottom:2%;left:1%;font-family:var(--pix);font-size:9px;background:#2e1236e6;border:2px solid var(--orange);color:var(--orange);padding:6px 9px;display:none;z-index:10}
#banner code{font-family:var(--mono);font-size:16px;color:#fff}

/* panels */
#panels{display:grid;grid-template-columns:minmax(300px,24%) 1fr minmax(320px,32%);border-top:4px solid #000;outline:2px solid var(--line);height:330px;transition:height .25s}
#panels.big{height:520px}
#panels section{padding:12px 16px;border-right:2px solid var(--line);overflow:hidden;display:flex;flex-direction:column;min-height:0}
#hq{overflow-y:auto!important;overflow-x:hidden}
#hq::-webkit-scrollbar{width:8px}
#panels section:last-child{border-right:0}
.ph{font-family:var(--pix);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ph .sp{flex:1}
.ph button{font-family:var(--pix);font-size:9px;background:#2e1236;border:2px solid var(--line);padding:6px 8px}
.ph button:hover{border-color:var(--gold)}
#hq h1{font-family:var(--pix);font-size:15px;line-height:1.35;margin:0;letter-spacing:.04em;text-shadow:3px 3px 0 #000}
#hq h1 small{display:block;font-size:10px;color:var(--gold);margin-top:6px;letter-spacing:.3em}
.live{font-family:var(--pix);font-size:10px;color:var(--green);margin:10px 0 8px;display:flex;align-items:center;gap:6px}
.live.demo{color:var(--orange)}
.live .dot{width:9px;height:9px;background:currentColor;display:inline-block;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.counts{margin-bottom:8px}
.proj{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center;margin:5px 0}
.proj .own{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.proj .pn{white-space:nowrap;color:var(--ink)} .proj .pn b{color:var(--green);font-weight:400}
.counts{display:flex;flex-wrap:wrap;gap:2px 12px}
.own{font-family:var(--pix);font-size:9px;padding:3px 5px;color:#0b0c1e;display:inline-block}
.sbar{display:flex;height:6px;margin:10px 0;background:#6a2f6e}
.sbar i{display:block;height:100%}
.btns{display:flex;gap:6px;margin-top:auto;padding-top:8px;align-items:center;flex-wrap:wrap}
.btns button{background:#2e1236;border:2px solid var(--line);padding:4px 8px;font-size:18px}
.btns button.on{border-color:var(--gold)}
.btns .hint{color:var(--muted);font-size:16px}
#chatlist,#sidelist{overflow:auto;flex:1;min-height:0;padding-right:6px}
.msg{padding:6px 0;border-bottom:1px dashed #6a2f6e}
.msg .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.msg time{color:var(--muted)}
.msg .nm{color:#8fb4ff;cursor:pointer}
.msg .tx{margin:3px 0 0 4px;color:#d7d3f5;word-break:break-word}
.tabs{display:flex;gap:16px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;font-family:var(--pix);font-size:12px;color:var(--muted);padding:0 0 4px}
.tabs button.on{color:#fff;border-color:#fff}
.pr{padding:8px 0;border-bottom:1px dashed #6a2f6e}
.pr a{color:#fff;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr a b{color:var(--muted);font-weight:400;margin-right:6px}
.badges{display:flex;gap:5px;margin:5px 0;flex-wrap:wrap}
.bd{font-size:16px;border:2px solid #b0508f;padding:0 6px}
.bd.ok{border-color:#2f8f55;color:var(--green)} .bd.bad{border-color:#b33a48;color:var(--red)} .bd.warn{border-color:#9c7a1c;color:var(--gold)}
.who{display:flex;gap:8px;align-items:center;color:var(--muted)}
.who .nm{color:#8fb4ff;cursor:pointer}
.empty{color:var(--muted);padding:8px 0}
.empty code{color:#fff}
::-webkit-scrollbar{width:8px} ::-webkit-scrollbar-thumb{background:#6a2f6e}
@media (max-width:900px){
  #panels{grid-template-columns:1fr;height:auto} #panels.big{height:auto}
  #panels section{border-right:0;border-bottom:2px solid var(--line);max-height:340px}
  #card{width:92%;right:4%}
}
</style>
</head>
<body>
<div id="app">
  <div id="map">
    <canvas id="cv" width="640" height="280"></canvas>
    <div id="ov"></div>
    <div id="banner"></div>
    <div id="card"></div>
    <div id="toast"></div>
  </div>
  <div id="panels">
    <section id="hq">
      <h1>AGENT AMUSEMENT PARK<small>· JIAQI ·</small></h1>
      <div class="live" id="live"><i class="dot"></i><span id="livetxt">LIVE</span> · <span id="clock"></span></div>
      <div class="counts" id="counts"></div>
      <div id="projects"></div>
      <div class="sbar" id="sbar"></div>
      <div class="btns">
        <button id="bSound" title="Beep when an agent is waiting for you">🔈</button>
        <button id="bNotify" title="Desktop notification when an agent is waiting for you">🔕</button>
        <button id="bDemo" title="Show made-up demo agents (click again for your real ones)">🎲 demo</button>
        <a id="livelink" target="_blank" style="display:none;border:2px solid var(--line);padding:4px 8px;font-size:18px">📡 live page</a>
        <span class="hint">click an agent · 1-9 select</span>
      </div>
    </section>
    <section id="chat">
      <div class="ph">💬 CHAT · <span id="chatn">0</span><span class="sp"></span><button id="bBig">▲ bigger</button></div>
      <div id="chatlist"></div>
    </section>
    <section id="side">
      <div class="ph tabs"><button id="tPR" class="on">📜 PRS · <span id="prn">0</span></button><button id="tFiles">🔒 FILES · <span id="fn">0</span></button></div>
      <div id="sidelist"></div>
    </section>
  </div>
</div>

<script>
'use strict';
/* =====================================================================
   Agent House Jiaqi — pixel map of your coding agents
   ===================================================================== */
const W = 640, H = 280;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const ov = document.getElementById('ov');
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- helpers ---------- */
function hash(s) { let h = 2166136261; s = String(s); for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rect = (c, x, y, w, h, col) => { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
function disc(c, cx, cy, rx, col, ry = rx) { c.fillStyle = col; for (let dy = -Math.ceil(ry); dy <= Math.ceil(ry); dy++) { const w = Math.floor(rx * Math.sqrt(Math.max(0, 1 - (dy * dy) / (ry * ry)))); c.fillRect(Math.round(cx - w), Math.round(cy + dy), w * 2 + 1, 1); } }
const hhmm = (t) => { const d = new Date(t); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
function ago(t) { const s = Math.max(0, (Date.now() - t) / 1000); if (s < 60) return Math.floor(s) + 's ago'; if (s < 3600) return Math.floor(s / 60) + 'm ago'; if (s < 86400) return Math.floor(s / 3600) + 'h ago'; return Math.floor(s / 86400) + 'd ago'; }
const OWN_COLORS = ['#ff8fc7', '#b9a0ff', '#7fd8be', '#ffd36b', '#ff9a8a', '#8fd0ff', '#f6b0ff', '#ffc4dd', '#c8f0a0'];
const ownColor = (p) => OWN_COLORS[hash(p) % OWN_COLORS.length];
const ownTag = (p) => `<span class="own" title="${esc(p)}" style="background:${ownColor(p)}">${esc(String(p || '?').toUpperCase().slice(0, 40))}</span>`;
const srcIcon = (s) => (s === 'codex' ? '🧠' : s === 'cursor' ? '🖱️' : s === 'claude-cloud' ? '✨' : s === 'visitor' ? '🛸' : '🤖');
const isMine = (a) => a.mine !== false;
const badgeText = (a) => (isMine(a) ? a.project : a.owner) || '?';
const badge = (a) => `<span class="own" style="background:${ownColor(badgeText(a))}">${esc(String(badgeText(a)).toUpperCase().slice(0, 12))}</span>`;

/* ---------- park layout ----------
   Every zone is a ride. Ride speed follows the riders' pace
   (= tool actions in the last 5 minutes): busy agents zoom, slow ones crawl. */
const Z = {
  newtask:   { label: 'NEW TASK',     ride: 'carousel',  icon: '🎠', lx: 330, ly: 112, ex: 330, ey: 186 },
  building:  { label: 'ROLLER COASTER · RUNNING', ride: 'coaster',   icon: '🎢', lx: 150, ly: 4,   ex: 150, ey: 140 },
  fixing:    { label: 'FIXING BUGS',  ride: 'bumper',    icon: '🚗', lx: 332, ly: 18,  ex: 332, ey: 100 },
  reviewing: { label: 'REVIEWING',    ride: 'ferris',    icon: '🎡', lx: 500, ly: 6,   ex: 500, ey: 146 },
  merging:   { label: 'SHIPPING',     ride: 'drop',      icon: '🚀', lx: 584, ly: 76,  ex: 588, ey: 224 },
  waiting:   { label: 'WAITING',      ride: null,        icon: '🎟️', lx: 206, ly: 154, ex: 206, ey: 192 },
  idle:      { label: 'IDLE',         ride: null,        icon: '🍦', lx: 78,  ly: 186, ex: 82,  ey: 228 },
  graveyard: { label: 'HAUNTED HOUSE',ride: null,        icon: '👻', lx: 446, ly: 170, ex: 0,   ey: 0 },
};
const HUB = [330, 204], GATE = [350, 278];
const POND = { x: 262, y: 252, rx: 28, ry: 11 };
const PATHS = [
  [330, 204, 240, 160, 150, 140], [330, 204, 402, 160, 332, 100], [330, 204, 430, 188, 500, 146],
  [500, 146, 566, 150, 588, 224], [330, 204, 270, 206, 206, 198], [176, 200, 124, 204, 90, 228],
  [350, 280, 338, 240, 330, 204], [150, 140, 90, 170, 82, 214],
];
const WAYPOINTS = { merging: [[500, 148]], idle: [[176, 202]] };
const TOMB_SLOTS = []; for (let r = 0; r < 2; r++) for (let c = 0; c < 9; c++) TOMB_SLOTS.push([382 + c * 16 + (r ? 8 : 0), 246 + r * 18]);
const BULB_COLORS = ['#ff5d6c', '#ffd36b', '#5be08a', '#6cb6ff', '#ff8ad8'];
const BULBS = [];
const avg = (xs) => xs.length ? xs.reduce((s, v) => s + v, 0) / xs.length : 0;
const paceOf = (list) => Math.min(30, avg(list.map((a) => a.pace || 0)));

/* coaster track: an oval with two big hills */
function trackPt(u) {
  return [150 + 116 * Math.cos(u), 92 + 32 * Math.sin(u) - 34 * Math.pow(Math.max(0, Math.sin(2 * u + 0.9)), 3) - 18 * Math.pow(Math.max(0, Math.sin(3 * u - 1)), 4)];
}
function line(c, x0, y0, x1, y1, col) { const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) | 0 || 1; c.fillStyle = col; for (let i = 0; i <= n; i++) c.fillRect(Math.round(x0 + (x1 - x0) * i / n), Math.round(y0 + (y1 - y0) * i / n), 1, 1); }

/* ---------- static background ---------- */
const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
const PATH_PTS = [];
function qpt(p, t) { const [x0, y0, cx, cy, x1, y1] = p, u = 1 - t; return [u * u * x0 + 2 * u * t * cx + t * t * x1, u * u * y0 + 2 * u * t * cy + t * t * y1]; }
const BUSY = [[24, 0, 278, 146], [272, 30, 392, 104], [450, 0, 552, 152], [292, 120, 368, 192], [566, 70, 612, 232], [160, 160, 258, 214], [36, 186, 124, 252], [366, 176, 532, 280], [322, 248, 378, 280], [388, 102, 432, 140], [POND.x - 34, POND.y - 16, POND.x + 34, POND.y + 16]];
function buildBackground() {
  const b = bg.getContext('2d'), r = rng(11);
  rect(b, 0, 0, W, H, '#8ccf9a');
  for (let i = 0; i < 6000; i++) rect(b, r() * W, r() * H, 1, 1, ['#83c792', '#96d6a4', '#8acb98', '#a2dcae', '#7abd89'][(r() * 5) | 0]);
  for (let i = 0; i < 300; i++) { const x = r() * W, y = r() * H; rect(b, x, y, 1, 2, '#b0e3b9'); rect(b, x + 2, y + 1, 1, 1, '#b0e3b9'); }
  // paths (warm cobblestone) with string lights
  for (const p of PATHS) for (let t = 0; t <= 1; t += 0.006) PATH_PTS.push(qpt(p, t));
  for (const [x, y] of PATH_PTS) disc(b, x, y, 6, '#e08fb0');
  for (const [x, y] of PATH_PTS) disc(b, x, y, 5, '#ffd1e1');
  for (let i = 0; i < PATH_PTS.length * 1.4; i++) { const [x, y] = PATH_PTS[(r() * PATH_PTS.length) | 0]; rect(b, x + r() * 8 - 4, y + r() * 8 - 4, 2, 1, r() < .5 ? '#f7bcd2' : '#ffe6f0'); }
  for (const p of PATHS) for (let t = 0.05; t < 0.96; t += 0.07) { const [x, y] = qpt(p, t), [x2, y2] = qpt(p, t + 0.01), dx = x2 - x, dy = y2 - y, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
    for (const s of [-1, 1]) BULBS.push([x + nx * 8 * s, y + ny * 8 * s, BULB_COLORS[(BULBS.length) % 5]]); }
  disc(b, HUB[0], HUB[1], 15, '#e08fb0', 9); disc(b, HUB[0], HUB[1], 13, '#ffe6f0', 8); disc(b, HUB[0], HUB[1], 4, '#6cb6ff', 2); rect(b, HUB[0], HUB[1] - 5, 1, 4, '#b9bfcc');
  // pond with swan boats
  disc(b, POND.x, POND.y, POND.rx + 3, '#e08fb0', POND.ry + 3); disc(b, POND.x, POND.y, POND.rx, '#2f7fd0', POND.ry); disc(b, POND.x - 3, POND.y - 2, POND.rx - 9, '#4794e0', POND.ry - 5);
  for (const [sx, sy] of [[250, 250], [272, 255]]) { rect(b, sx, sy, 7, 3, '#f4f1ea'); rect(b, sx + 5, sy - 3, 1, 3, '#f4f1ea'); rect(b, sx + 5, sy - 4, 2, 1, '#f4f1ea'); rect(b, sx + 7, sy - 4, 1, 1, '#ff9a3d'); }
  drawCoasterTrack(b); drawRink(b); drawFerrisBase(b); drawCarouselBase(b); drawDropTower(b); drawQueue(b); drawPicnic(b); drawHaunted(b); drawGate(b); drawBoard(b);
  // trees / flowers only where the park is empty
  const freeAt = (x, y) => x > 3 && x < W - 3 && y > 6 && y < H - 2 && BUSY.every(([a, c, d, e]) => x < a - 3 || x > d + 3 || y < c - 3 || y > e + 8) && PATH_PTS.every(([px, py]) => (x - px) ** 2 + (y - py) ** 2 > 110)
    && Object.values(Z).every((z) => !(Math.abs(x - z.lx) < 48 && y > z.ly - 6 && y < z.ly + 22));
  const trees = [];
  for (let i = 0; i < 1600 && trees.length < 90; i++) { const x = r() * W, y = r() * H; if (freeAt(x, y) && trees.every(([tx, ty]) => (tx - x) ** 2 + (ty - y) ** 2 > 120)) trees.push([x, y, r()]); }
  trees.sort((a, c) => a[1] - c[1]);
  for (const [x, y, k] of trees) (k < 0.4 ? pine : roundTree)(b, x, y, k);
  for (let i = 0; i < 260; i++) { const x = r() * W, y = r() * H; if (!freeAt(x, y)) continue; const k = r();

/* ---------- alerts ---------- */
let actx;
function beep() { try { actx = actx || new AudioContext(); const o = actx.createOscillator(), g = actx.createGain(); o.type = 'square'; o.frequency.setValueAtTime(660, actx.currentTime); o.frequency.setValueAtTime(880, actx.currentTime + 0.09); g.gain.setValueAtTime(0.05, actx.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.25); o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + 0.26); } catch {} }
function toast(msg) { const d = document.createElement('div'); d.textContent = msg; $('toast').appendChild(d); setTimeout(() => d.remove(), 5000); }
function checkAlerts() {
  const first = prevStatus.size === 0;
  for (const a of S.agents) {
    const before = prevStatus.get(a.id);
    const zBefore = prevZone.get(a.id);
    if (a.work === 'merging' && zBefore && zBefore !== 'merging') { firework(); setTimeout(() => firework(), 450); }
    prevZone.set(a.id, a.work);
    if (!first && isMine(a) && a.status === 'waiting' && before && before !== 'waiting') {
      toast(`⏳ ${a.name} (${a.project}) is waiting for you`);
      if (soundOn) beep();
      if (notifyOn && document.hidden) try { new Notification('Agent House Jiaqi', { body: `${a.name} in ${a.project} is waiting for you` }); } catch {}
    }
    prevStatus.set(a.id, a.status);
  }
}

/* ---------- data ---------- */
function apply(data) {
  S = Object.assign({ agents: [], prs: [], files: [], chat: [] }, data, { _seen: S._seen });
  for (const a of S.agents) { a.work = a.zone; if (a.status === 'working') a.zone = 'building'; }
  byId = new Map(S.agents.map((a) => [a.id, a]));
  layoutTargets(); buildOverlay(); renderPanels(); checkAlerts();
  if (selected) renderCard();
  const bn = $('banner');

  const realBtn = '<button onclick="demo=false;anim.clear();S._seen=false;syncBtns();refresh()" style="margin-left:10px;font-family:var(--pix);font-size:11px;background:#2a1030;color:#fff;border:2px solid #000;padding:6px 10px">show my real agents</button>';
  if (S._remoteMissing) { bn.style.display = 'block'; bn.innerHTML = `📡 No live snapshot yet · ${esc(S.owner || 'JIAQI')}'s Mac hasn't published anything`; }
  else if (S._offline) { bn.style.display = 'block'; bn.innerHTML = location.protocol === 'file:' ? 'This file was opened directly · start the park with <code>node server.js</code> (or double-click start.command) to see your agents' : 'Can\'t reach the park server on your Mac · start it with <code>node server.js</code>, then reload'; }

  else if (S.remote && !live().length) { bn.style.display = 'block'; bn.innerHTML = `📡 live from ${esc(S.owner)}'s Mac · no agents running right now`; }
  else if (S.remote) bn.style.display = 'none';
  else if (S.mode === 'demo' && S._remoteMissing) { bn.style.display = 'block'; bn.innerHTML = 'DEMO DATA · the live snapshot could not be loaded'; }
  else if (S.mode === 'demo') { bn.style.display = 'block'; bn.innerHTML = '🎲 DEMO — these agents are made up' + realBtn; }

/* ---------- live mode (GitHub Pages): read the snapshot the Mac publishes to a gist ---------- */
const REMOTE = location.protocol !== 'file:' && !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
let LIVE = null, remoteState = null, remoteAt = 0;
async function fetchRemote() {
  if (!LIVE) {
    const q = new URLSearchParams(location.search);
    try { LIVE = await fetch('live.json', { cache: 'no-store' }).then((r) => r.json()); } catch { LIVE = {}; }
    if (q.get('gist')) LIVE.gistId = q.get('gist');
    if (q.get('owner')) LIVE.owner = q.get('owner');
  }
  if (!LIVE.gistId) throw new Error('no gist configured');
  if (remoteState && Date.now() - remoteAt < 55000) return remoteState;   // GitHub allows 60 anonymous calls / hour
  const g = await fetch(`https://api.github.com/gists/${LIVE.gistId}`, { cache: 'no-store' });
  if (!g.ok) { if (remoteState) return remoteState; throw new Error('gist ' + g.status); }
  const gist = await g.json();
  const houses = [];
  for (const [fname, f] of Object.entries(gist.files || {})) {
    if (!fname.endsWith('.json')) continue;
    let d = null;
    try { d = f.truncated ? await fetch(f.raw_url).then((r) => r.json()) : JSON.parse(f.content); } catch {}
    if (d && d.app === 'agent-house' && Array.isArray(d.agents)) houses.push(d);
  }
  const owner = String(LIVE.owner || (houses[0] && houses[0].owner) || '').toUpperCase();
  const now = Date.now(), agents = [], prs = [], chat = [];
  let newest = 0;
  for (const d of houses) {
    const o = String(d.owner || '?').toUpperCase(), mine = o === owner, offline = now - (d.updatedAt || 0) > 5 * 60000;
    newest = Math.max(newest, d.updatedAt || 0);
    for (const a0 of d.agents) {
      const a = Object.assign({ task: '', lastUser: '', lastAction: '', recent: [], chat: [], edited: [], cwd: '', prs: [] }, a0);
      a.id = o + ':' + a0.id; a.owner = o; a.mine = mine;
      if (offline && a.status !== 'dead') { a.status = now - a.lastAt > 60 * 60000 ? 'dead' : 'idle'; a.zone = a.status === 'dead' ? 'graveyard' : 'idle'; a.pace = 0; }
      agents.push(a);
      for (const m of a.chat || []) chat.push({ t: m.t, agent: a.id, dir: m.k === 'user' ? 'in' : 'out', text: m.text });
    }
    for (const p of d.prs || []) if (!prs.find((x) => x.url === p.url)) prs.push(Object.assign({ agents: [] }, p));
  }
  for (const a of agents) if (a.branch && a.status !== 'dead') for (const p of prs) if (p.branch === a.branch) p.agents.push(a.id);
  chat.sort((x, y) => y.t - x.t);
  remoteState = { mode: 'live', remote: true, owner, publishedAt: newest, agents, prs: prs.sort((a, b) => b.updatedAt - a.updatedAt), files: [], chat: chat.slice(0, 40),
    team: { enabled: houses.length > 1, error: null, members: houses.filter((d) => String(d.owner).toUpperCase() !== owner) } };
  remoteAt = Date.now();
  return remoteState;
}
async function refresh() {
  if (demo) { apply(demoState()); return; }
  if (REMOTE) {
    try { apply(JSON.parse(JSON.stringify(await fetchRemote()))); }
    catch (e) { apply({ mode: 'live', remote: true, _remoteMissing: true, agents: [], prs: [], files: [], chat: [], owner: (LIVE && LIVE.owner) || 'JIAQI' }); }
    return;
  }
  try {
    const r = await fetch('/api/state', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    apply(await r.json());
  } catch (e) { apply({ mode: 'live', _offline: true, agents: [], prs: [], files: [], chat: [] }); }
}
